name: SHAMS scheduled publishing

on:
  schedule:
    - cron: '*/5 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shams-scheduled-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: functions
      - name: Publish approved scheduled content
        run: node scripts/publish-scheduled-content.cjs
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
