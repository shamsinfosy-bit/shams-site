<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050912">
  <title>شمس | SHAMS</title>
  <meta name="description" content="اكتشف الأفلام والمسلسلات على شمس">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #050912;
      color: #f7f7f7;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 20px 16px;
      text-align: center;
      border-bottom: 1px solid #242b38;
      background: #080e19;
    }
    .logo {
      color: #c9a050;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 2px;
    }
    .tagline {
      margin-top: 6px;
      color: #aab2c0;
      font-size: 13px;
    }
    #app {
      width: min(900px, 100%);
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .promo {
      text-align: center;
    }
    .poster {
      display: block;
      width: min(100%, 340px);
      max-height: 480px;
      object-fit: cover;
      margin: 0 auto 22px;
      border-radius: 16px;
      background: #111827;
      box-shadow: 0 12px 36px #0008;
    }
    h1 {
      color: #e2bd70;
      font-size: clamp(25px, 5vw, 36px);
      line-height: 1.4;
      margin: 10px 0;
    }
    .original-title {
      color: #aab2c0;
      margin-bottom: 18px;
      direction: ltr;
    }
    .description {
      max-width: 680px;
      margin: 18px auto 24px;
      color: #d1d5db;
      line-height: 1.9;
      white-space: pre-line;
    }
    .trailer {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 14px;
      background: #111827;
      margin: 24px auto;
    }
    .trailer iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .watch {
      display: inline-block;
      margin: 18px 0;
      padding: 15px 32px;
      border-radius: 12px;
      background: #c9a050;
      color: #080e19;
      font-size: 18px;
      font-weight: 800;
      text-decoration: none;
    }
    .watch:hover { background: #e2bd70; }
    .official-note {
      color: #aab2c0;
      font-size: 13px;
      margin-top: 4px;
    }
    .message {
      padding: 60px 12px;
      text-align: center;
      color: #e2bd70;
      line-height: 1.8;
    }
    footer {
      text-align: center;
      padding: 22px 12px;
      color: #8791a2;
      border-top: 1px solid #242b38;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">SHAMS | شمس</div>
    <div class="tagline">اكتشف عالم الأفلام والمسلسلات</div>
  </header>

  <div id="app">
    <div class="message">جارٍ تحميل المحتوى...</div>
  </div>

  <footer>SHAMS • شمس — اكتشف محتواك المفضل</footer>

  <script type="module" src="/src/promo/main.ts"></script>
</body>
</html>
